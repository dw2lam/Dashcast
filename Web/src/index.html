<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Dashcast</title>
<!--CSS-->
</head>
<body>
<canvas id="v"></canvas>
<video id="rv" playsinline autoplay muted hidden></video>
<div id="touch"></div>

<div id="pill" class="pill"><i></i><span>Connecting…</span></div>

<div id="bar" class="bar">
  <button id="bKb" type="button" aria-label="Keyboard" hidden><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M6.5 9.5h.01M10 9.5h.01M13.5 9.5h.01M17 9.5h.01M6.5 12.5h.01M10 12.5h.01M13.5 12.5h.01M17 12.5h.01M8 15.5h8"/></svg></button>
  <button id="bFs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="bSt" type="button" aria-label="Stats"><svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9"/></svg></button>
</div>

<div id="stats" class="panel" hidden>
  <dl id="sDl"></dl>
  <div class="seg" id="modes"><button type="button" data-m="interactive">Interactive</button><button type="button" data-m="cinema">Cinema</button><button type="button" data-m="auto">Auto</button></div>
</div>

<div id="toast" class="toast" hidden></div>

<div id="tap" class="tap">
  <div class="brand">Dashcast</div>
  <div class="play"><svg viewBox="0 0 24 24"><path d="M8.5 5.8v12.4c0 .8.9 1.3 1.6.9l9.6-6.2c.6-.4.6-1.3 0-1.7l-9.6-6.2c-.7-.5-1.6 0-1.6.8z"/></svg></div>
  <h1>Tap to start</h1>
  <p>Turns on sound and touch control</p>
</div>

<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type to your Mac">
<!--JS-->
</body>
</html>
