<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dashcast Probe</title>
<style>
  :root {
    --bg: #0a0a0c;
    --panel: #16161a;
    --panel-border: #26262c;
    --row-border: #232328;
    --text: #f2f2f2;
    --muted: #9a9aa2;
    --ok: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 20px;
    line-height: 1.4;
  }
  body { padding: 22px 26px 90px; }
  h1 { font-size: 38px; margin: 0 0 4px; letter-spacing: 0.5px; }
  .sub { color: var(--muted); font-size: 19px; margin-bottom: 22px; }
  section {
    background: var(--panel);
    border-radius: 14px;
    padding: 16px 20px 18px;
    margin-bottom: 18px;
    border: 1px solid var(--panel-border);
  }
  section h2 { font-size: 24px; margin: 0 0 10px; color: var(--accent); font-weight: 700; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 18px;
    padding: 8px 0;
    border-bottom: 1px solid var(--row-border);
    font-size: 19px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--muted); flex-shrink: 0; }
  .value {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    text-align: right;
    word-break: break-word;
    font-size: 18px;
  }
  .value.ok { color: var(--ok); font-weight: 700; }
  .value.bad { color: var(--bad); font-weight: 700; }
  .value.warn { color: var(--warn); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 17px; margin-top: 4px; }
  th, td { text-align: center; padding: 8px 6px; border-bottom: 1px solid var(--row-border); }
  th:first-child, td:first-child { text-align: left; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; }
  th { color: var(--muted); font-weight: 600; }
  td.ok { color: var(--ok); font-weight: 700; font-size: 22px; }
  td.bad { color: var(--bad); font-weight: 700; font-size: 22px; }
  .links a {
    display: block;
    color: var(--accent);
    font-size: 21px;
    padding: 10px 0;
    text-decoration: none;
    border-bottom: 1px solid var(--row-border);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    word-break: break-all;
  }
  .links a:last-child { border-bottom: none; }
  button#sendAgainBtn {
    font-size: 23px;
    padding: 16px 28px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #04222f;
    font-weight: 700;
    width: 100%;
    margin-top: 4px;
  }
  button#sendAgainBtn:active { opacity: 0.75; }
  #sendStatus { margin-top: 12px; font-size: 19px; color: var(--muted); }
  #sendStatus.ok { color: var(--ok); }
  #sendStatus.bad { color: var(--bad); }
  .note { color: var(--muted); font-size: 15px; margin-bottom: 8px; }
</style>
</head>
<body>

  function base64ToUint8(b64) {
    var binStr = atob(b64);
    var len = binStr.length;
    var bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) {

  function hasWebGL(v) {

      var ctx = null;
      if (v === 2) {
        ctx = c.getContext('webgl2');

      }

  function probeAudio() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return { supported: false };
      var ctx = new Ctx();
      var info = {
        supported: true,
        sampleRate: ctx.sampleRate,
        baseLatency: (typeof ctx.baseLatency === 'number') ? ctx.baseLatency : null,
        outputLatency: (typeof ctx.outputLatency === 'number') ? ctx.outputLatency : null,

  /* ---- Annex B access-unit splitting (splits on AUD NALs) ---- */
  function splitAccessUnits(bytes, targetNalType, isHevc) {
    var n = bytes.length;
    var scStarts = [];
    var i = 0;
    while (i < n - 3) {
      if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) {
        scStarts.push({ scPos: i, hdrPos: i + 3 });
        i += 3;
      } else if (i < n - 4 && bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 0 && bytes[i + 3] === 1) {
        scStarts.push({ scPos: i, hdrPos: i + 4 });
        i += 4;
      } else {
        i += 1;
      }
    }
    var audPositions = [];
    for (var k = 0; k < scStarts.length; k++) {
      var s = scStarts[k];
      if (s.hdrPos >= n) continue;
      var nalType = isHevc ? ((bytes[s.hdrPos] >> 1) & 0x3F) : (bytes[s.hdrPos] & 0x1F);
      if (nalType === targetNalType) {
        audPositions.push(s.scPos);
      }
    }
    var units = [];
    for (var j = 0; j < audPositions.length; j++) {
      var startPos = audPositions[j];
      var endPos = (j + 1 < audPositions.length) ? audPositions[j + 1] : n;
      units.push(bytes.subarray(startPos, endPos));
    }
    return units;
  }

  /* ---- VideoDecoder.isConfigSupported grid ---- */
  async function runIsConfigSupported() {
    var results = [];
    var codecs = [
      'avc1.42E01F', 'avc1.4D401F', 'avc1.640028', 'avc1.640032',
      'hvc1.1.6.L123.B0', 'vp09.00.10.08', 'av01.0.04M.08'
    ];
    var resolutions = [{ w: 1280, h: 720 }, { w: 1920, h: 1080 }];
    for (var ci = 0; ci < codecs.length; ci++) {
      for (var ri = 0; ri < resolutions.length; ri++) {
        var codec = codecs[ci];
        var res = resolutions[ri];
        var entry = { codec: codec, width: res.w, height: res.h };
        try {
          var r = await VideoDecoder.isConfigSupported({
            codec: codec,
            codedWidth: res.w,
            codedHeight: res.h,
            hardwareAcceleration: 'prefer-hardware'
          });
          entry.supported = !!(r && r.supported);
        } catch (e) {
          entry.supported = false;
          entry.error = describeErr(e);
        }
        results.push(entry);
      }
    }
    return results;
  }

  function renderConfigTable(sec, results) {
    var codecs = [];
    var seen = {};
    for (var i = 0; i < results.length; i++) {
      var c = results[i].codec;
      if (!seen[c]) { seen[c] = true; codecs.push(c); }
    }
    var resList = [[1280, 720], [1920, 1080]];
    var table = document.createElement('table');
    var thead = document.createElement('tr');
    thead.innerHTML = '<th>codec</th><th>1280&times;720</th><th>1920&times;1080</th>';
    table.appendChild(thead);
    for (var ci = 0; ci < codecs.length; ci++) {
      var tr = document.createElement('tr');
      var tdCodec = document.createElement('td');
      tdCodec.textContent = codecs[ci];
      tr.appendChild(tdCodec);
      for (var ri = 0; ri < resList.length; ri++) {
        var w = resList[ri][0], h = resList[ri][1];
        var match = null;
        for (var j = 0; j < results.length; j++) {
          if (results[j].codec === codecs[ci] && results[j].width === w && results[j].height === h) {
            match = results[j];
            break;
          }
        }
        var td = document.createElement('td');
        if (match) {
          td.textContent = match.supported ? '✓' : '✗';
          td.className = match.supported ? 'ok' : 'bad';
          if (match.error) td.title = match.error;
        } else {
          td.textContent = '?';
        }
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }
    sec.appendChild(table);
  }

  /* ---- decode benchmark ---- */
  function decodeBench(codec, w, h, units) {
    return new Promise(function (resolve) {
      try {
        var frameTimes = [];
        var submitTimes = {};
        var errorMsg = null;
        var decoder = new VideoDecoder({
          output: function (frame) {
            var t = performance.now();
            var submitT = submitTimes[frame.timestamp];
            if (submitT !== undefined) {
              frameTimes.push(t - submitT);
            }
            frame.close();
          },
          error: function (e) {
            errorMsg = describeErr(e);
          }
        });
        decoder.configure({
          codec: codec,
          codedWidth: w,
          codedHeight: h,
          optimizeForLatency: true,
          hardwareAcceleration: 'prefer-hardware'
        });
        var startAll = performance.now();
        for (var i = 0; i < units.length; i++) {
          var ts = i * 33333;
          submitTimes[ts] = performance.now();
          var chunk = new EncodedVideoChunk({
            type: i === 0 ? 'key' : 'delta',
            timestamp: ts,
            data: units[i]
          });
          decoder.decode(chunk);
        }
        decoder.flush().then(function () {
          var totalMs = performance.now() - startAll;
          try { decoder.close(); } catch (e2) {}
          if (frameTimes.length === 0) {
            resolve({ error: errorMsg || 'no frames decoded', frames: 0 });
            return;
          }
          var sorted = frameTimes.slice().sort(function (a, b) { return a - b; });
          var mean = frameTimes.reduce(function (a, b) { return a + b; }, 0) / frameTimes.length;
          var p95idx = Math.min(sorted.length - 1, Math.ceil(0.95 * sorted.length) - 1);
          resolve({
            meanMs: round2(mean),
            p95Ms: round2(sorted[p95idx]),
            totalMs: round2(totalMs),
            frames: frameTimes.length,
            error: errorMsg
          });
        }).catch(function (e) {
          resolve({ error: describeErr(e) });
        });
      } catch (e) {
        resolve({ error: describeErr(e) });
      }
    });
  }

      out.h264_720p = await decodeBench('avc1.64001F', 1280, 720, units720);
      out.h264_1080p = await decodeBench('avc1.640028', 1920, 1080, units1080);
    } catch (e) {
      out.h264_error = describeErr(e);
    }
    try {
      var hevc_720 = base64ToUint8(HEVC_720P_B64);
      var hevc_1080 = base64ToUint8(HEVC_1080P_B64);
      var hunits720 = splitAccessUnits(hevc_720, 35, true);
      var hunits1080 = splitAccessUnits(hevc_1080, 35, true);
      out.hevc_720p = await decodeBench('hvc1.1.6.L93.B0', 1280, 720, hunits720);
      out.hevc_1080p = await decodeBench('hvc1.1.6.L120.B0', 1920, 1080, hunits1080);
    } catch (e) {
      out.hevc_error = describeErr(e);
    }
    return out;
  }

  function renderDecodeResults(sec, dec) {
    sec.innerHTML = '';
    var items = [
      ['H.264 720p', dec.h264_720p],
      ['H.264 1080p', dec.h264_1080p],
      ['HEVC 720p', dec.hevc_720p],
      ['HEVC 1080p', dec.hevc_1080p]
    ];
    for (var i = 0; i < items.length; i++) {
      var label = items[i][0], r = items[i][1];
      if (!r) { addRow(sec, label, 'not run', 'warn'); continue; }
      if (r.error) { addRow(sec, label, 'error: ' + r.error, 'bad'); continue; }
      addRow(sec, label, 'mean ' + r.meanMs + 'ms · p95 ' + r.p95Ms + 'ms · total ' + r.totalMs + 'ms (' + r.frames + 'f)', 'ok');
    }
    if (dec.h264_error) addRow(sec, 'H.264 error', dec.h264_error, 'bad');
    if (dec.hevc_error) addRow(sec, 'HEVC error', dec.hevc_error, 'bad');
  }

  /* ---- JPEG decode benchmark ---- */
  function jpegBench() {
    return new Promise(function (resolve) {
      try {
        if (typeof createImageBitmap !== 'function') {
          resolve({ error: 'createImageBitmap not supported' });
          return;
        }
        var bytes = base64ToUint8(JPEG_B64);
        var blob = new Blob([bytes], { type: 'image/jpeg' });
        var times = [];
        var n = 20;
        function runOne(i) {
          if (i >= n) {
            var mean = times.reduce(function (a, b) { return a + b; }, 0) / times.length;
            resolve({ meanMs: round2(mean), count: times.length });
            return;
          }
          var t0 = performance.now();
          createImageBitmap(blob).then(function (bmp) {
            var t1 = performance.now();
            times.push(t1 - t0);
            if (bmp.close) bmp.close();
            runOne(i + 1);
          }).catch(function (e) {
            resolve({ error: describeErr(e), count: times.length });
          });
        }
        runOne(0);
      } catch (e) {
        resolve({ error: describeErr(e) });
      }
    });
  }

  /* ---- canvas drawImage throughput ---- */
  function loadImageEl(dataUrl) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('image load failed')); };
      img.src = dataUrl;
    });
  }

  async function getDrawSource() {
    if (typeof createImageBitmap === 'function') {
      try {
        var bytes = base64ToUint8(JPEG_B64);
        var blob = new Blob([bytes], { type: 'image/jpeg' });
        return await createImageBitmap(blob);
      } catch (e) { /* fall through to <img> */ }
    }
    return await loadImageEl('data:image/jpeg;base64,' + JPEG_B64);
  }

  async function canvasThroughputBench() {
    try {
      var src = await getDrawSource();
      var canvas = document.createElement('canvas');
      canvas.width = 1280;
      canvas.height = 720;
      var ctx = canvas.getContext('2d');
      var n = 60;
      var t0 = performance.now();
      for (var i = 0; i < n; i++) {
        ctx.drawImage(src, 0, 0);
      }
      var t1 = performance.now();
      if (src.close) src.close();
      return { totalMs: round2(t1 - t0), meanMs: round2((t1 - t0) / n), count: n };
    } catch (e) {
      return { error: describeErr(e) };
    }
  }

  /* ---- report send ---- */
  function sendReport(report) {
    var statusEl = $('sendStatus');
    statusEl.className = '';
    statusEl.textContent = 'Sending…';
    return fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(report)
    }).then(function (res) {
      if (res.ok) {
        statusEl.className = 'ok';
        statusEl.textContent = 'Sent ✓ (' + new Date().toLocaleTimeString() + ')';
      } else {
        statusEl.className = 'bad';
        statusEl.textContent = 'Send failed: HTTP ' + res.status;
      }
    }).catch(function (e) {
      statusEl.className = 'bad';
      statusEl.textContent = 'Send failed: ' + describeErr(e);
    });
  }

  $('sendAgainBtn').addEventListener('click', function () {
    if (window.__lastReport) {
      sendReport(window.__lastReport);
    }
  });

  /* ---- main ---- */
  async function main() {
    var report = { ts: new Date().toISOString(), simulateOld: SIMULATE_OLD, errors: {} };
    var resultsEl = $('results');

    try {
      var envSec = addSection(resultsEl, 'Environment');
      var ua = navigator.userAgent;
      var chromeMatch = ua.match(/Chrom(?:e|ium)\/(\d+)/);
      var chromeMajor = chromeMatch ? parseInt(chromeMatch[1], 10) : null;
      report.userAgent = ua;
      report.chromeMajor = chromeMajor;
      addRow(envSec, 'User-Agent', ua, null);
      addRow(envSec, 'Chrome version', chromeMajor !== null ? String(chromeMajor) : 'unknown', chromeMajor !== null ? 'ok' : 'bad');
      addRow(envSec, 'innerWidth × innerHeight', innerWidth + ' × ' + innerHeight, null);
      addRow(envSec, 'devicePixelRatio', String(devicePixelRatio), null);
      addRow(envSec, 'screen.width × height', screen.width + ' × ' + screen.height, null);
      addRow(envSec, 'isSecureContext', String(isSecureContext), isSecureContext ? 'ok' : 'bad');
      addRow(envSec, 'hardwareConcurrency', (typeof navigator.hardwareConcurrency !== 'undefined') ? String(navigator.hardwareConcurrency) : 'n/a', null);
      addRow(envSec, 'deviceMemory', (typeof navigator.deviceMemory !== 'undefined') ? (navigator.deviceMemory + ' GB') : 'n/a', null);
      if (SIMULATE_OLD) addRow(envSec, 'simulateOld', 'true — WebCodecs forced off', 'warn');
      report.viewport = {
        innerWidth: innerWidth, innerHeight: innerHeight, devicePixelRatio: devicePixelRatio,
        screenWidth: screen.width, screenHeight: screen.height
      };
      report.isSecureContext = isSecureContext;
      report.hardwareConcurrency = (typeof navigator.hardwareConcurrency !== 'undefined') ? navigator.hardwareConcurrency : null;
      report.deviceMemory = (typeof navigator.deviceMemory !== 'undefined') ? navigator.deviceMemory : null;
    } catch (e) { report.errors.environment = describeErr(e); }

    try {
      var featSec = addSection(resultsEl, 'Feature support');
      var feats = {};
      feats.VideoDecoder = hasVideoDecoder();
      feats.AudioWorkletNode = typeof AudioWorkletNode !== 'undefined';
      feats.OffscreenCanvas = typeof OffscreenCanvas !== 'undefined';
      feats.WebGL = hasWebGL(1);
      feats.WebGL2 = hasWebGL(2);
      feats.RTCPeerConnection = typeof RTCPeerConnection !== 'undefined';
      var ms = probeMediaSource();
      feats.MediaSource = ms.supported;
      feats.MediaSource_avc1_42E01F = !!ms.avc1_42E01F;
      feats.createImageBitmap = typeof createImageBitmap === 'function';
      feats.fullscreenEnabled = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
      feats.Worker = typeof Worker !== 'undefined';
      feats.WebSocket = typeof WebSocket !== 'undefined';
      var order = ['VideoDecoder', 'AudioWorkletNode', 'OffscreenCanvas', 'WebGL', 'WebGL2', 'RTCPeerConnection',
        'MediaSource', 'MediaSource_avc1_42E01F', 'createImageBitmap', 'fullscreenEnabled', 'Worker', 'WebSocket'];
      for (var fi = 0; fi < order.length; fi++) {
        var key = order[fi];
        addRow(featSec, key, feats[key] ? 'yes' : 'no', feats[key] ? 'ok' : 'bad');
      }
      report.features = feats;
    } catch (e) { report.errors.features = describeErr(e); }

    try {
      var audSec = addSection(resultsEl, 'AudioContext');
      var audioInfo = probeAudio();
      addRow(audSec, 'supported', audioInfo.supported ? 'yes' : 'no', audioInfo.supported ? 'ok' : 'bad');
      if (audioInfo.supported) {
        addRow(audSec, 'sampleRate', audioInfo.sampleRate + ' Hz', null);
        addRow(audSec, 'baseLatency', audioInfo.baseLatency !== null ? (audioInfo.baseLatency * 1000).toFixed(2) + ' ms' : 'n/a', null);
        addRow(audSec, 'outputLatency', audioInfo.outputLatency !== null ? (audioInfo.outputLatency * 1000).toFixed(2) + ' ms' : 'n/a', null);
      }
      report.audio = audioInfo;
    } catch (e) { report.errors.audio = describeErr(e); }

    try {
      var cfgSec = addSection(resultsEl, 'VideoDecoder.isConfigSupported');
      if (!hasVideoDecoder()) {
        addRow(cfgSec, 'status', SIMULATE_OLD ? 'skipped (simulateOld)' : 'VideoDecoder not available', 'warn');
        report.videoDecoderSupport = { skipped: true };
      } else {
        var cfgResults = await runIsConfigSupported();
        renderConfigTable(cfgSec, cfgResults);
        report.videoDecoderSupport = cfgResults;
      }
    } catch (e) { report.errors.isConfigSupported = describeErr(e); }

    try {
      var decSec = addSection(resultsEl, 'Decode benchmark');
      if (!hasVideoDecoder()) {
        addRow(decSec, 'status', SIMULATE_OLD ? 'skipped (simulateOld)' : 'VideoDecoder not available', 'warn');
        report.decodeBench = { skipped: true };
      } else {
        addRow(decSec, 'status', 'running…', null);
        var decResults = await runDecodeBenches();
        renderDecodeResults(decSec, decResults);
        report.decodeBench = decResults;
      }
    } catch (e) { report.errors.decodeBench = describeErr(e); }

    try {
      var jpgSec = addSection(resultsEl, 'JPEG decode (createImageBitmap × 20)');
      var jpgResult = await jpegBench();
      if (jpgResult.error) {
        addRow(jpgSec, 'error', jpgResult.error, 'bad');
      } else {
        addRow(jpgSec, 'mean', jpgResult.meanMs + ' ms', 'ok');
        addRow(jpgSec, 'count', String(jpgResult.count), null);
      }
      report.jpegBench = jpgResult;
    } catch (e) { report.errors.jpegBench = describeErr(e); }

    try {
      var cvSec = addSection(resultsEl, 'Canvas drawImage × 60');
      var cvResult = await canvasThroughputBench();
      if (cvResult.error) {
        addRow(cvSec, 'error', cvResult.error, 'bad');
      } else {
        addRow(cvSec, 'total', cvResult.totalMs + ' ms', 'ok');
        addRow(cvSec, 'mean', cvResult.meanMs + ' ms/frame', null);
      }
      report.canvasBench = cvResult;
    } catch (e) { report.errors.canvasBench = describeErr(e); }

    $('statusLine').textContent = 'Checks complete — ' + new Date().toLocaleTimeString();
    window.__lastReport = report;
    await sendReport(report);
  }

  main();
})();
</script>
</body>
</html>
